name: Daily LinkedIn Scraper

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    env:
      DISPLAY: :99
      LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
      LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libasound2t64 \
            libnss3 \
            libxss1 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libxcomposite1 \
            libxrandr2 \
            libgbm1 \
            libgtk-3-0 \
            libpango-1.0-0 \
            libdrm2 \
            libxdamage1 \
            libxfixes3 \
            libx11-xcb1 \
            libxcb1 \
            fonts-liberation \
            xdg-utils \
            libasound2-data

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.24.4
          pip install -r requirements.txt

      - name: Install Playwright & Chromium
        run: |
          python -m playwright install chromium

      - name: Recreate Google service account key
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}" | base64 -d > service-account.json

      - name: Start Xvfb (GUI for headed mode)
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &

      - name: Run scraper in headed mode
        run: |
          python main.py
